
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: "**/*.geode"
          if-no-files-found: error
